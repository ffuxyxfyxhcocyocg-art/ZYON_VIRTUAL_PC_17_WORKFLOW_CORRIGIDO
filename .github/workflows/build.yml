name: Build and Release ZYON Virtual PC
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zyon-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    if: github.event_name == 'pull_request' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zyon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Decode permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ZYON_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ZYON_KEYSTORE_BASE64 secret" && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zyon-release.jks"
          echo "ZYON_KEYSTORE_PATH=$RUNNER_TEMP/zyon-release.jks" >> "$GITHUB_ENV"
      - run: chmod +x ./gradlew
      - name: Build signed release APK
        env:
          ZYON_VERSION_NAME: ${GITHUB_REF_NAME#v}
          ZYON_VERSION_CODE: ${GITHUB_REF_NAME#v}
          ZYON_KEYSTORE_PASSWORD: ${{ secrets.ZYON_KEYSTORE_PASSWORD }}
          ZYON_KEY_ALIAS: ${{ secrets.ZYON_KEY_ALIAS }}
          ZYON_KEY_PASSWORD: ${{ secrets.ZYON_KEY_PASSWORD }}
        run: |
          test -n "$ZYON_KEYSTORE_PASSWORD"
          test -n "$ZYON_KEY_ALIAS"
          test -n "$ZYON_KEY_PASSWORD"
          ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Generate SHA-256 checksum
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - name: Publish APK and checksum in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
